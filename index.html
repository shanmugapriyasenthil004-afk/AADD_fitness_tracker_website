<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lane – Fitness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Lane<span>.</span></h1>
  <p id="today-label"></p>
</header>

<main>
  <section class="track-card" aria-label="Today's progress">
    <div class="track-wrap">
      <svg viewBox="0 0 300 170" class="track" role="img" aria-label="Daily goal progress">
        <rect x="20" y="20" width="260" height="130" rx="65" class="lane lane3" pathLength="100"/>
        <rect x="38" y="38" width="224" height="94" rx="47" class="lane lane2" pathLength="100"/>
        <rect x="56" y="56" width="188" height="58" rx="29" class="lane lane1" pathLength="100"/>
        <rect id="progress" x="20" y="20" width="260" height="130" rx="65" pathLength="100" class="prog"/>
      </svg>
      <div class="track-center">
        <strong id="today-min">0</strong>
        <small id="goal-line">of 30 min</small>
      </div>
    </div>
    <div class="goal-set">
      <label for="goal">Daily goal (minutes)</label>
      <input id="goal" type="number" min="5" max="600" value="30">
      <p id="verdict"></p>
    </div>
  </section>

  <section class="stats">
    <div><b id="streak">0</b><span>day streak</span></div>
    <div><b id="wk-min">0</b><span>minutes this week</span></div>
    <div><b id="wk-cal">0</b><span>kcal this week</span></div>
  </section>

  <section class="panel">
    <h2>Log a workout</h2>
    <form id="form">
      <label>Activity
        <input name="type" list="acts" required maxlength="30" placeholder="Running">
        <datalist id="acts"><option>Running</option><option>Cycling</option><option>Strength</option><option>Yoga</option><option>Swimming</option><option>Walking</option><option>HIIT</option></datalist>
      </label>
      <label>Minutes <input name="minutes" type="number" min="1" required placeholder="35"></label>
      <label>Calories <input name="calories" type="number" min="0" placeholder="280"></label>
      <label>Date <input name="date" type="date" required></label>
      <label class="wide">Note <input name="note" maxlength="100" placeholder="Felt strong on the hills"></label>
      <button type="submit">Save workout</button>
    </form>
    <p id="err" role="alert"></p>
  </section>

  <section class="panel">
    <h2>Last 7 days</h2>
    <div id="bars" class="bars"></div>
  </section>

  <section class="panel">
    <h2>Last 12 weeks</h2>
    <div id="heat" class="heat"></div>
    <p class="legend">Darker squares mean longer sessions.</p>
  </section>

  <section class="panel">
    <h2>History</h2>
    <ul id="list" class="list"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
